name: Publish Docker images

on:
  schedule:
    # Asia/Tokyo 每日 00:00；只检测，没变化就不构建
    - cron: '0 15 * * *'

  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even if upstream images are unchanged'
        required: false
        type: boolean
        default: false

  push:
    branches:
      - main
    tags:
      - '*'
    paths:
      - Dockerfile
      - Dockerfile.heavy
      - .github/workflows/publish-docker.yml

env:
  REGISTRY: ghcr.io
  BASE_IMAGE: jbtt-2025/pico-claw-web
  HEAVY_IMAGE: jbtt-2025/pico-claw-web-heavy
  PLAYWRIGHT_RUNTIME_OS: noble

concurrency:
  group: publish-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push Docker images
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo jq

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve upstream images
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          PICOCLAW_UPSTREAM_IMAGE="$(
            awk -F= '
              /^ARG[[:space:]]+PICOCLAW_IMAGE=/ {
                print $2
                exit
              }
            ' Dockerfile
          )"

          if [ -z "$PICOCLAW_UPSTREAM_IMAGE" ]; then
            echo "Failed to resolve PICOCLAW_IMAGE from Dockerfile." >&2
            exit 1
          fi

          PLAYWRIGHT_RUNTIME_TAG="$(
            skopeo list-tags docker://mcr.microsoft.com/playwright \
              | jq -r --arg os "${PLAYWRIGHT_RUNTIME_OS}" '
                  .Tags[]
                  | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+-" + $os + "$"))
                ' \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$PLAYWRIGHT_RUNTIME_TAG" ]; then
            echo "Failed to resolve latest Playwright runtime tag." >&2
            exit 1
          fi

          PLAYWRIGHT_VERSION="${PLAYWRIGHT_RUNTIME_TAG#v}"
          PLAYWRIGHT_VERSION="${PLAYWRIGHT_VERSION%-${PLAYWRIGHT_RUNTIME_OS}}"

          HEAVY_RUNTIME_IMAGE="mcr.microsoft.com/playwright:${PLAYWRIGHT_RUNTIME_TAG}"

          echo "picoclaw_upstream_image=${PICOCLAW_UPSTREAM_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "playwright_version=${PLAYWRIGHT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "heavy_runtime_image=${HEAVY_RUNTIME_IMAGE}" >> "$GITHUB_OUTPUT"

          echo "PicoClaw upstream image: ${PICOCLAW_UPSTREAM_IMAGE}"
          echo "Playwright runtime image: ${HEAVY_RUNTIME_IMAGE}"
          echo "Playwright version: ${PLAYWRIGHT_VERSION}"

      - name: Check upstream image digests
        id: check
        shell: bash
        env:
          FORCE_REBUILD: ${{ inputs.force_rebuild || 'false' }}
          PICOCLAW_UPSTREAM_IMAGE: ${{ steps.resolve.outputs.picoclaw_upstream_image }}
          HEAVY_RUNTIME_IMAGE: ${{ steps.resolve.outputs.heavy_runtime_image }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          image_digest() {
            local image="$1"
            echo "Inspecting digest: ${image}" >&2
            skopeo inspect --format '{{.Digest}}' "docker://${image}"
          }

          ghcr_tag_exists() {
            local image="$1"
            skopeo inspect \
              --creds "${GITHUB_ACTOR}:${GITHUB_TOKEN}" \
              "docker://${image}" >/dev/null 2>&1
          }

          PICOCLAW_DIGEST="$(image_digest "${PICOCLAW_UPSTREAM_IMAGE}")"
          RUNTIME_DIGEST="$(image_digest "${HEAVY_RUNTIME_IMAGE}")"

          if [ -z "$PICOCLAW_DIGEST" ]; then
            echo "Failed to resolve PicoClaw digest." >&2
            exit 1
          fi

          if [ -z "$RUNTIME_DIGEST" ]; then
            echo "Failed to resolve Playwright runtime digest." >&2
            exit 1
          fi

          PICO_SHORT="${PICOCLAW_DIGEST#sha256:}"
          PICO_SHORT="${PICO_SHORT:0:12}"

          RUNTIME_SHORT="${RUNTIME_DIGEST#sha256:}"
          RUNTIME_SHORT="${RUNTIME_SHORT:0:12}"

          HEAVY_SHORT="${PICO_SHORT}-${RUNTIME_SHORT}"

          BASE_UPSTREAM_TAG="${REGISTRY}/${BASE_IMAGE}:upstream-${PICO_SHORT}"
          HEAVY_UPSTREAM_TAG="${REGISTRY}/${HEAVY_IMAGE}:upstream-${HEAVY_SHORT}"

          BASE_EXISTS=false
          HEAVY_EXISTS=false

          if ghcr_tag_exists "$BASE_UPSTREAM_TAG"; then
            BASE_EXISTS=true
          fi

          if ghcr_tag_exists "$HEAVY_UPSTREAM_TAG"; then
            HEAVY_EXISTS=true
          fi

          if [ "${GITHUB_EVENT_NAME}" = "push" ] || [ "${FORCE_REBUILD}" = "true" ]; then
            BUILD_BASE=true
            BUILD_HEAVY=true
          else
            BUILD_BASE=true
            BUILD_HEAVY=true

            if [ "$BASE_EXISTS" = "true" ]; then
              BUILD_BASE=false
            fi

            if [ "$HEAVY_EXISTS" = "true" ]; then
              BUILD_HEAVY=false
            fi
          fi

          echo "picoclaw_digest=${PICOCLAW_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "runtime_digest=${RUNTIME_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "pico_short=${PICO_SHORT}" >> "$GITHUB_OUTPUT"
          echo "runtime_short=${RUNTIME_SHORT}" >> "$GITHUB_OUTPUT"
          echo "heavy_short=${HEAVY_SHORT}" >> "$GITHUB_OUTPUT"
          echo "build_base=${BUILD_BASE}" >> "$GITHUB_OUTPUT"
          echo "build_heavy=${BUILD_HEAVY}" >> "$GITHUB_OUTPUT"

          echo "PicoClaw digest: ${PICOCLAW_DIGEST}"
          echo "Runtime digest: ${RUNTIME_DIGEST}"
          echo "Base marker: ${BASE_UPSTREAM_TAG}"
          echo "Heavy marker: ${HEAVY_UPSTREAM_TAG}"
          echo "Base exists: ${BASE_EXISTS}"
          echo "Heavy exists: ${HEAVY_EXISTS}"
          echo "Build base: ${BUILD_BASE}"
          echo "Build heavy: ${BUILD_HEAVY}"

      - name: Skip base image
        if: steps.check.outputs.build_base != 'true'
        run: echo "Base image already exists for this PicoClaw digest."

      - name: Skip heavy image
        if: steps.check.outputs.build_heavy != 'true'
        run: echo "Heavy image already exists for this PicoClaw + runtime digest."

      - name: Save version info
        if: steps.check.outputs.build_base == 'true' || steps.check.outputs.build_heavy == 'true'
        run: |
          git describe --tags --always > VERSION

      - name: Extract metadata for base image
        if: steps.check.outputs.build_base == 'true'
        id: meta_base
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BASE_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=upstream-${{ steps.check.outputs.pico_short }}
            type=ref,event=tag
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.base.name=${{ steps.resolve.outputs.picoclaw_upstream_image }}
            org.opencontainers.image.base.digest=${{ steps.check.outputs.picoclaw_digest }}

      - name: Build and push base image
        if: steps.check.outputs.build_base == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PICOCLAW_IMAGE=${{ steps.resolve.outputs.picoclaw_upstream_image }}@${{ steps.check.outputs.picoclaw_digest }}
          tags: ${{ steps.meta_base.outputs.tags }}
          labels: ${{ steps.meta_base.outputs.labels }}
          cache-from: type=gha,scope=pico-claw-web
          cache-to: type=gha,mode=max,scope=pico-claw-web

      - name: Extract metadata for heavy image
        if: steps.check.outputs.build_heavy == 'true'
        id: meta_heavy
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.HEAVY_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=upstream-${{ steps.check.outputs.heavy_short }}
            type=ref,event=tag
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.picoclaw.base.name=${{ steps.resolve.outputs.picoclaw_upstream_image }}
            org.opencontainers.image.picoclaw.base.digest=${{ steps.check.outputs.picoclaw_digest }}
            org.opencontainers.image.runtime.base.name=${{ steps.resolve.outputs.heavy_runtime_image }}
            org.opencontainers.image.runtime.base.digest=${{ steps.check.outputs.runtime_digest }}
            org.opencontainers.image.playwright.version=${{ steps.resolve.outputs.playwright_version }}

      - name: Build and push heavy image
        if: steps.check.outputs.build_heavy == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.heavy
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PICOCLAW_IMAGE=${{ steps.resolve.outputs.picoclaw_upstream_image }}@${{ steps.check.outputs.picoclaw_digest }}
            RUNTIME_IMAGE=${{ steps.resolve.outputs.heavy_runtime_image }}@${{ steps.check.outputs.runtime_digest }}
            PLAYWRIGHT_VERSION=${{ steps.resolve.outputs.playwright_version }}
          tags: ${{ steps.meta_heavy.outputs.tags }}
          labels: ${{ steps.meta_heavy.outputs.labels }}
          cache-from: type=gha,scope=pico-claw-web-heavy
          cache-to: type=gha,mode=max,scope=pico-claw-web-heavy
